name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            test
          severity: warning

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n clawctl.bash
        run: bash -n ./clawctl.bash
      - name: bash -n install/install.sh
        run: bash -n ./install/install.sh

  smoke-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n test/smoke.sh
        run: bash -n test/smoke.sh
      - name: shellcheck test/smoke.sh
        run: shellcheck test/smoke.sh

  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Bumped from 1.22 → 1.24 to satisfy the MCP Go SDK pulled in for
          # `clawctl mcp` (US-025); the SDK's transitive deps require 1.24.
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: fuzz SSE parser
        run: go test -run=^$ -fuzz=FuzzParseSSE -fuzztime=5s ./internal/sse/
