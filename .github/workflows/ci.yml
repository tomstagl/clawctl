name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            test
          severity: warning

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n clawctl.bash
        run: bash -n ./clawctl.bash
      - name: bash -n install/install.sh
        run: bash -n ./install/install.sh

  smoke-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n test/smoke.sh
        run: bash -n test/smoke.sh
      - name: shellcheck test/smoke.sh
        run: shellcheck test/smoke.sh

  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check for published releases
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 2>/dev/null || true)
          if [ -z "$releases" ]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip (no release published yet)
        if: steps.release-check.outputs.has_release == 'false'
        run: echo "no release published yet, skipping"
      - name: Install clawctl via install.sh
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: bash install/install.sh
      - name: Verify installed binary
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: |
          out=$("$CLAWCTL_INSTALL_DIR/clawctl" version)
          echo "$out"
          echo "$out" | grep -q clawctl
          "$CLAWCTL_INSTALL_DIR/clawctl" --help

  parity:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install python3 and jq
        run: sudo apt-get install -y python3 jq
      - name: parity-health.sh
        id: health
        continue-on-error: true
        run: bash test/parity-health.sh
      - name: parity-models.sh
        id: models
        continue-on-error: true
        run: bash test/parity-models.sh
      - name: parity-raw.sh
        id: raw
        continue-on-error: true
        run: bash test/parity-raw.sh
      - name: parity-verify.sh
        id: verify
        continue-on-error: true
        run: bash test/parity-verify.sh
      - name: parity-redact.sh
        id: redact
        continue-on-error: true
        run: bash test/parity-redact.sh
      - name: parity-trace.sh
        id: trace
        continue-on-error: true
        run: bash test/parity-trace.sh
      - name: Fail if any parity script failed
        if: always()
        run: |
          failed=0
          [ "${{ steps.health.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.models.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.raw.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.verify.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.redact.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.trace.outcome }}" = "failure" ] && failed=1
          exit $failed

  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Bumped from 1.22 → 1.24 to satisfy the MCP Go SDK pulled in for
          # `clawctl mcp` (US-025); the SDK's transitive deps require 1.24.
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: fuzz SSE parser
        run: go test -run=^$ -fuzz=FuzzParseSSE -fuzztime=5s ./internal/sse/
