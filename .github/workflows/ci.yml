name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            test
          severity: warning

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n clawctl.bash
        run: bash -n ./clawctl.bash
      - name: bash -n install/install.sh
        run: bash -n ./install/install.sh

  smoke-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n test/smoke.sh
        run: bash -n test/smoke.sh
      - name: shellcheck test/smoke.sh
        run: shellcheck test/smoke.sh

  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check for published releases
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 2>/dev/null || true)
          if [ -z "$releases" ]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip (no release published yet)
        if: steps.release-check.outputs.has_release == 'false'
        run: echo "no release published yet, skipping"
      - name: Install clawctl via install.sh
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: bash install/install.sh
      - name: Verify installed binary
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: |
          out=$("$CLAWCTL_INSTALL_DIR/clawctl" version)
          echo "$out"
          echo "$out" | grep -q clawctl
          "$CLAWCTL_INSTALL_DIR/clawctl" --help
      - name: Health check (mock gateway)
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: |
          PORT_FILE="$(mktemp)"
          python3 -c "
          import socketserver, http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
            def do_GET(s):
              b=b'{\"status\":\"ok\"}';s.send_response(200);s.send_header('Content-Type','application/json');s.send_header('Content-Length',str(len(b)));s.end_headers();s.wfile.write(b)
            def log_message(*a): pass
          srv=socketserver.TCPServer(('127.0.0.1',0),H)
          open(sys.argv[1],'w').write(str(srv.server_address[1]))
          srv.serve_forever()
          " "$PORT_FILE" &
          SRV=$!
          for _ in {1..40}; do [ -s "$PORT_FILE" ] && break; sleep 0.05; done
          if [ ! -s "$PORT_FILE" ]; then echo "mock health server did not start" >&2; kill "$SRV" 2>/dev/null || true; exit 1; fi
          PORT="$(cat "$PORT_FILE")"
          out="$(CLAWCTL_HOST="http://127.0.0.1:$PORT" CLAWCTL_TIMEOUT=5 "$CLAWCTL_INSTALL_DIR/clawctl" health)"
          echo "$out"
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok','status not ok'"
          kill "$SRV" 2>/dev/null || true
      - name: Redact round-trip (dt0c01 leak)
        if: steps.release-check.outputs.has_release == 'true'
        env:
          CLAWCTL_INSTALL_DIR: ${{ runner.temp }}/clawctl-install
        run: |
          LEAK="dt0c01.ABCDEFGHIJKLMNOPQRST"
          result=$(printf 'the secret is %s and other text' "$LEAK" | "$CLAWCTL_INSTALL_DIR/clawctl" _redact test 2>/dev/null)
          if echo "$result" | grep -qF "$LEAK"; then
            echo "FAIL: dt0c01 token value leaked verbatim in _redact output" >&2
            exit 1
          fi
          echo "ok: dt0c01 token redacted from stdout"
      - name: Plugin manifest check
        if: steps.release-check.outputs.has_release == 'true'
        run: bash test/plugin-manifest.sh

  parity:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install python3 and jq
        run: sudo apt-get install -y python3 jq
      - name: parity-health.sh
        id: health
        continue-on-error: true
        run: bash test/parity-health.sh
      - name: parity-models.sh
        id: models
        continue-on-error: true
        run: bash test/parity-models.sh
      - name: parity-raw.sh
        id: raw
        continue-on-error: true
        run: bash test/parity-raw.sh
      - name: parity-verify.sh
        id: verify
        continue-on-error: true
        run: bash test/parity-verify.sh
      - name: parity-redact.sh
        id: redact
        continue-on-error: true
        run: bash test/parity-redact.sh
      - name: parity-trace.sh
        id: trace
        continue-on-error: true
        run: bash test/parity-trace.sh
      - name: Fail if any parity script failed
        if: always()
        run: |
          failed=0
          [ "${{ steps.health.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.models.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.raw.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.verify.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.redact.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.trace.outcome }}" = "failure" ] && failed=1
          exit $failed

  envelope:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Cache npm (ajv-cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ajv-cli-v5-${{ runner.os }}
      - name: Install deps (python3, jq, curl)
        run: sudo apt-get install -y python3 jq curl
      - name: Build Go binary
        run: go build -o "$RUNNER_TEMP/clawctl-go" ./cmd/clawctl
      - name: validate-fixtures.sh
        id: fixtures
        continue-on-error: true
        run: bash test/validate-fixtures.sh
      - name: envelope-msg.sh (bash)
        id: msg_bash
        continue-on-error: true
        run: bash test/envelope-msg.sh
      - name: envelope-stream.sh (bash)
        id: stream_bash
        continue-on-error: true
        run: bash test/envelope-stream.sh
      - name: envelope-redacted.sh (bash)
        id: redacted_bash
        continue-on-error: true
        run: bash test/envelope-redacted.sh
      - name: envelope-msg.sh (go)
        id: msg_go
        continue-on-error: true
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/envelope-msg.sh
      - name: envelope-stream.sh (go)
        id: stream_go
        continue-on-error: true
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/envelope-stream.sh
      - name: envelope-redacted.sh (go)
        id: redacted_go
        continue-on-error: true
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/envelope-redacted.sh
      - name: Fail if any envelope script failed
        if: always()
        run: |
          failed=0
          [ "${{ steps.fixtures.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.msg_bash.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.stream_bash.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.redacted_bash.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.msg_go.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.stream_go.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.redacted_go.outcome }}" = "failure" ] && failed=1
          exit $failed

  contract:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Go binary
        run: go build -o "$RUNNER_TEMP/clawctl-go" ./cmd/clawctl
      - name: exit-codes.sh (bash)
        id: exitcodes_bash
        continue-on-error: true
        run: bash test/exit-codes.sh
      - name: cli-hardening.sh (bash)
        id: hardening_bash
        continue-on-error: true
        run: bash test/cli-hardening.sh
      - name: install-resolver.sh
        id: resolver
        continue-on-error: true
        run: bash test/install-resolver.sh
      - name: exit-codes.sh (go)
        id: exitcodes_go
        continue-on-error: true
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/exit-codes.sh
      - name: cli-hardening.sh (go)
        id: hardening_go
        continue-on-error: true
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/cli-hardening.sh
      - name: Fail if any contract script failed
        if: always()
        run: |
          failed=0
          [ "${{ steps.exitcodes_bash.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.hardening_bash.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.resolver.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.exitcodes_go.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.hardening_go.outcome }}" = "failure" ] && failed=1
          exit $failed

  plugin:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install deps (python3-yaml)
        run: sudo apt-get install -y python3-yaml
      - name: Build Go binary
        run: go build -o "$RUNNER_TEMP/clawctl-go" ./cmd/clawctl
      - name: plugin-manifest.sh
        run: bash test/plugin-manifest.sh
      - name: plugin-commands.sh
        run: BIN="$RUNNER_TEMP/clawctl-go" bash test/plugin-commands.sh
      - name: skill-loopback.sh
        run: bash test/skill-loopback.sh

  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Bumped from 1.22 → 1.24 to satisfy the MCP Go SDK pulled in for
          # `clawctl mcp` (US-025); the SDK's transitive deps require 1.24.
          go-version: "1.24"
      - name: Install Linux keychain backends
        run: sudo apt-get install -y libsecret-tools pass
      - name: go vet
        run: go vet ./...
      - name: go test (with coverage)
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage report
        run: go tool cover -func=coverage.out
      - name: coverage floor (internal/ ≥ 65%)
        run: |
          go test -cover ./internal/... | awk '
            /^ok/ {
              pct = $5; gsub(/%/, "", pct)
              if (pct+0 < 65.0) {
                printf "FAIL: %s %.1f%% < 65.0%%\n", $2, pct+0
                fail = 1
              }
            }
            END { exit fail+0 }
          '
      - name: upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - name: fuzz SSE parser
        run: go test -run=^$ -fuzz=FuzzParseSSE -fuzztime=5s ./internal/sse/
