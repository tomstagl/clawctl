name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Lint the workflow itself so the release path can't silently rot.
  # Acceptance criterion (US-029): "Workflow lints with actionlint".
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  # Run the test suite once before producing release artifacts. Building four
  # binaries from a broken tree wastes a release slot, so gate on `go test`.
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: [actionlint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        run: |
          out="clawctl-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
            -o "${out}" \
            ./cmd/clawctl
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clawctl-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -la dist
      - name: generate checksums
        working-directory: dist
        run: sha256sum clawctl-* > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/clawctl-* dist/SHA256SUMS
